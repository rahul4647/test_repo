version: '3.8'
services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - app-network
    volumes:
      - app-data:/app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://app:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  mongodb:
    image: mongo:6.0
    networks:
      - app-network
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  app-data:
  mongo-data:
networks:
  app-network:
    driver: bridge