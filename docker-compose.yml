version: '3.9'
services:
  app:
    build: .
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    healthcheck:
      test: ["curl", "--fail", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    env_file:
      - .env
  mongo:
    image: mongo:6.0@sha256:7c5f6d2c6c0f9d2e5f6c7c8d9e0f1a2b3c4d5e6f7c8d9e0f1a2b3c4d5
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["mongo", "admin", "--eval", "db.runCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  mongo-data:

networks:
  default:
    driver: bridge