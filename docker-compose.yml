version: '3.9'
services:
  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["curl", "--fail", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./:/app
    env_file:
      - .env
  mongo:
    image: mongo:6@sha256:5e3ccce1e91c9f7f1c8f4c0e0d2a9f0f0d2a9f0f0d2a9f0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["curl", "--fail", "http://localhost:27017"]
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  mongo-data:

networks:
  default:
    name: my-network