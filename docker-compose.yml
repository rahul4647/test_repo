version: '3.9'
services:
  app:
    build: .
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    healthcheck:
      test: ["curl", "--fail", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - .:/app
    env_file:
      - .env
  mongo:
    image: mongo:6.0.3@sha256:4b5c8e9a2f2c9f2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["mongo", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  mongo-data:
networks:
  default:
    driver: bridge