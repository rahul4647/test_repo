version: '3.8'
services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - app-network
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://app:3000/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3

  mongodb:
    image: mongo:5.0
    restart: always
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/test --quiet
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mongodb_data:

networks:
  app-network:
    driver: bridge