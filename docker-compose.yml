version: '3.9'
services:
  app:
    build: .
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    healthcheck:
      test: ["curl", "--fail", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
  mongo:
    image: mongo:6@sha256:2d8c2ff6d6be3c3f0a5c4b4a3b2c1d1e1f1e2f2d2c2
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["mongo", "admin", "--eval", "db.runCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  mongo-data:

networks:
  default:
    driver: bridge