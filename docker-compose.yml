version: '3.9'
services:
  app:
    build: .
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    healthcheck:
      test: ["curl", "--fail", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    env_file:
      - .env
  mongo:
    image: mongo:6.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["mongo", "admin", "--eval", "db.runCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  mongo-data:

networks:
  default:
    driver: bridge