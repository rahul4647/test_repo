receivers:
  otlp:
    protocols:
      grpc:
      http:
  prometheus:
    config:
      scrape_configs:
        - job_name: 'nextjs-app'
          static_configs:
            - targets: ['0.0.0.0:3000']
exporters:
  otlp/tempo:
    endpoint: http://tempo:4317
  prometheus:
    endpoint: '0.0.0.0:8889'
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp/tempo]
    metrics:
      receivers: [prometheus]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      exporters: [loki]