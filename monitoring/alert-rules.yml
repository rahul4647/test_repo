groups:
  - name: 'four_golden_signals'
    rules:
      - alert: HighLatency
        expr: histogram_quantile(0.9, rate(http_request_duration_seconds_bucket[5m])) > 0.5
        for: 2m
        labels:
          severity: 'critical'
        annotations:
          summary: 'High request latency'
      - alert: HighErrorRate
        expr: rate(http_requests_total{status!~"2.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: 'critical'
        annotations:
          summary: 'High error rate'
      - alert: HighRequestRate
        expr: rate(http_requests_total[1m]) > 1000
        for: 2m
        labels:
          severity: 'warning'
        annotations:
          summary: 'High request rate'
      - alert: HighSaturation
        expr: node_cpu_seconds_total{mode="idle"}[5m] < 0.2
        for: 2m
        labels:
          severity: 'warning'
        annotations:
          summary: 'High CPU saturation'