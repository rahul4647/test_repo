groups:
- name: nextjs-app.rules
  rules:
  - alert: HighErrorRate
    expr: rate(errors[1m]) > 0.05
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: High error rate
  - alert: HighLatency
    expr: latency > 1
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: High latency
  - alert: LowThroughput
    expr: throughput < 10
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Low throughput
  - alert: HighMemoryUsage
    expr: memory_usage > 80
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: High memory usage