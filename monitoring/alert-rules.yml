groups:
  - name: four-golden-signals
    rules:
      - alert: HighLatency
        expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job="nextjs-app"}[5m])) by (le)) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High request latency"
          description: "The 99th percentile request latency is above 1s."
      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{job="nextjs-app",status=~"5.."}[5m])) / sum(rate(http_requests_total{job="nextjs-app"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate"
          description: "More than 5% of requests are failing."
      - alert: HighThroughput
        expr: sum(rate(http_requests_total{job="nextjs-app"}[5m])) > 100
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "High request throughput"
          description: "The request throughput is above 100 requests per second."
      - alert: Saturation
        expr: (sum(rate(http_requests_total{job="nextjs-app"}[5m])) by (instance)) / ignoring(instance) group_left sum(machine_cpu_cores) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU saturation"
          description: "CPU saturation is above 90%."