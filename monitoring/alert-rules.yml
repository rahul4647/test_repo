groups:
- name: nextjs-app
  rules:
  - alert: HighErrorRate
    expr: rate(errors[1m]) > 0.05
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: High error rate
  - alert: HighLatency
    expr: latency > 500
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: High latency
  - alert: HighRequestRate
    expr: rate(requests[1m]) > 100
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: High request rate
  - alert: LowSaturation
    expr: saturation < 0.5
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Low saturation