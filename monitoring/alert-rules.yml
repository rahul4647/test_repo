groups:
- name: nextjs-app.rules
  rules:
  - alert: HighErrorRate
    expr: rate(errors[1m]) > 0.05
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: High error rate
  - alert: HighRequestLatency
    expr: rate(requests[1m]) > 100
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: High request latency
  - alert: LowUptime
    expr: uptime < 0.9
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Low uptime
  - alert: HighMemoryUsage
    expr: memory_usage_percent > 80
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: High memory usage