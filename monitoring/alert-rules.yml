groups:
- name: nextjs-app
  rules:
  - alert: HighErrorRate
    expr: rate(errors[1m]) > 0.05
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: High error rate
  - alert: HighRequestLatency
    expr: rate(requests[1m]) > 100
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: High request latency
  - alert: HighMemoryUsage
    expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100 < 10
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: High memory usage
  - alert: HighCPUUsage
    expr: rate(cpu_usage[1m]) > 80
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: High CPU usage