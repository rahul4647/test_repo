groups:
  - name: 'four-golden-signals'
    rules:
      - alert: HighLatency
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: 'page'
        annotations:
          summary: 'High request latency'
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: 'page'
        annotations:
          summary: 'High error rate'
      - alert: LowAvailability
        expr: (1 - (rate(http_requests_total{status=~"2.."}[5m]) / rate(http_requests_total[5m]))) > 0.1
        for: 10m
        labels:
          severity: 'page'
        annotations:
          summary: 'Low availability'
      - alert: HighSaturation
        expr: sum(rate(process_cpu_seconds_total[5m])) by (instance) > 0.9
        for: 5m
        labels:
          severity: 'page'
        annotations:
          summary: 'High CPU saturation'