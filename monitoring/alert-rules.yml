groups:
  - name: 'Four Golden Signals'
    rules:
      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job='nextjs-app'}[5m])) by (le)) > 1
        for: 10m
        labels:
          severity: 'warning'
        annotations:
          summary: 'High request latency on nextjs-app'
          description: 'Request latency is above 1s for 95th percentile over the last 10 minutes.'

      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{job='nextjs-app',status=~"5.."}[5m])) by (job) / sum(rate(http_requests_total{job='nextjs-app'}[5m])) by (job) > 0.05
        for: 10m
        labels:
          severity: 'critical'
        annotations:
          summary: 'High error rate on nextjs-app'
          description: 'Error rate is above 5% over the last 10 minutes.'

      - alert: LowThroughput
        expr: sum(rate(http_requests_total{job='nextjs-app'}[5m])) < 10
        for: 10m
        labels:
          severity: 'warning'
        annotations:
          summary: 'Low throughput on nextjs-app'
          description: 'Request throughput is below 10 requests per second over the last 10 minutes.'

      - alert: HighRequestLatency95th
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job='nextjs-app'}[5m])) by (le)) > 1
        for: 10m
        labels:
          severity: 'critical'
        annotations:
          summary: '95th percentile latency on nextjs-app'
          description: 'Request latency is above 1s for 95th percentile over the last 10 minutes.'