groups:
  - name: 'four-golden-signals'
    rules:
      - alert: HighLatency
        expr: histogram_quantile(0.9, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 10m
        labels:
          severity: 'warning'
        annotations:
          summary: 'High request latency'

      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{status_code=~"5.."}[5m])) / sum(rate(http_requests_total[5m])) > 0.05
        for: 10m
        labels:
          severity: 'critical'
        annotations:
          summary: 'High error rate'

      - alert: HighRequestRate
        expr: sum(rate(http_requests_total[5m])) > 100
        for: 10m
        labels:
          severity: 'info'
        annotations:
          summary: 'High request rate'

      - alert: Saturation
        expr: node_load1 / count(count(node_cpu_seconds_total) by (cpu)) * 100 > 90
        for: 10m
        labels:
          severity: 'critical'
        annotations:
          summary: 'High CPU saturation'