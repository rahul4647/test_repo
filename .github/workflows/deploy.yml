name: Deploy Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

jobs:
  staging_deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: arn:aws:iam::123456789012:role/my-github-actions-role
          role-session-name: GitHubActions
          aws-region: us-east-1

      - name: Deploy to ECS
        run: aws ecs update-service --cluster my-cluster --service my-service --force-new-deployment --region us-east-1

      - name: Wait for service stability
        run: aws ecs wait services-stable --cluster my-cluster --services my-service --region us-east-1

  smoke_test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: staging_deploy
    timeout-minutes: 30
    steps:
      - name: Run Playwright tests
        run: npm run smoke-test

  production_deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: smoke_test
    timeout-minutes: 30
    environment:
      name: production
      url: https://my-production-url.com
    steps:
      - name: Manual approval
        run: echo "Waiting for manual approval"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: arn:aws:iam::123456789012:role/my-github-actions-role
          role-session-name: GitHubActions
          aws-region: us-east-1

      - name: Deploy to ECS
        run: aws ecs update-service --cluster my-cluster --service my-service --force-new-deployment --region us-east-1

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    if: failure()
    needs: production_deploy
    timeout-minutes: 30
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: arn:aws:iam::123456789012:role/my-github-actions-role
          role-session-name: GitHubActions
          aws-region: us-east-1

      - name: Rollback to previous revision
        run: aws ecs update-service --cluster my-cluster --service my-service --desired-count 0 --region us-east-1