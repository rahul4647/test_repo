name: Deployment Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

jobs:
  staging_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Deploy to ECS
        run: |
          aws ecs update-service --cluster my-staging-cluster --service my-staging-service --force-new-deployment

  smoke_test:
    runs-on: ubuntu-latest
    needs: staging_deploy
    timeout-minutes: 30
    steps:
      - name: Run smoke tests
        run: npm run test:smoke -- --url=https://staging.example.com

  production_deploy:
    runs-on: ubuntu-latest
    needs: smoke_test
    timeout-minutes: 30
    environment:
      name: production
      url: https://production.example.com
    steps:
      - name: Deploy to ECS
        run: |
          aws ecs update-service --cluster my-production-cluster --service my-production-service --force-new-deployment

  rollback:
    runs-on: ubuntu-latest
    if: failure()
    needs: production_deploy
    timeout-minutes: 30
    steps:
      - name: Rollback ECS service
        run: |
          aws ecs update-service --cluster my-production-cluster --service my-production-service --desired-count 0