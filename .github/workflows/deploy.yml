name: Deploy Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

jobs:
  deploy-to-staging:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: arn:aws:iam::123456789012:role/my-github-actions-role
          aws-region: us-east-1
      - name: Deploy to ECS
        run: |
          aws ecs update-service --cluster my-staging-cluster --service my-service --force-new-deployment --region us-east-1
      - name: Wait for service stability
        run: |
          aws ecs wait services-stable --cluster my-staging-cluster --services my-service --region us-east-1

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy-to-staging
    steps:
      - name: Run Playwright tests
        run: |
          npm run test:e2e
        env:
          BASE_URL: https://staging.example.com

  deploy-to-production:
    runs-on: ubuntu-latest
    needs: smoke-test
    environment:
      name: production
      url: https://production.example.com
    steps:
      - name: Manual approval
        run: echo "Deployment approved."
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: arn:aws:iam::123456789012:role/my-github-actions-role
          aws-region: us-east-1
      - name: Deploy to ECS
        run: |
          aws ecs update-service --cluster my-production-cluster --service my-service --force-new-deployment --region us-east-1
      - name: Health check
        run: |
          aws ecs wait services-stable --cluster my-production-cluster --services my-service --region us-east-1

  rollback:
    runs-on: ubuntu-latest
    if: failure()
    needs: deploy-to-production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: arn:aws:iam::123456789012:role/my-github-actions-role
          aws-region: us-east-1
      - name: Roll back to previous revision
        run: |
          aws ecs update-service --cluster my-production-cluster --service my-service --desired-count 0 --region us-east-1
          aws ecs update-service --cluster my-production-cluster --service my-service --desired-count 1 --region us-east-1