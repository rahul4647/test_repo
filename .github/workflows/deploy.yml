name: Deploy Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

jobs:
  staging_deploy:
    name: Staging Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: arn:aws:iam::123456789012:role/my-github-actions-role
          aws-region: us-east-1
      - name: Deploy to ECS
        run: |
          aws ecs update-service --cluster my-cluster --service my-service --force-new-deployment
      - name: Wait for service stability
        run: |
          aws ecs wait services-stable --cluster my-cluster --services my-service

  smoke_test:
    name: Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Run Playwright tests
        run: npm run test:smoke

  production_deploy:
    name: Production Deploy
    runs-on: ubuntu-latest
    needs: [staging_deploy, smoke_test]
    if: success()
    steps:
      - name: Manual approval
        run: echo "Awaiting manual approval"
        timeout-minutes: 30
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: arn:aws:iam::123456789012:role/my-github-actions-role
          aws-region: us-east-1
      - name: Deploy to ECS
        run: |
          aws ecs update-service --cluster my-cluster --service my-service --force-new-deployment
      - name: Health check validation
        run: |
          aws ecs wait services-stable --cluster my-cluster --services my-service

  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Roll back to previous task definition
        run: |
          aws ecs update-service --cluster my-cluster --service my-service --task-definition my-service:previous